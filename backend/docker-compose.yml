version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: avenor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avenor
      POSTGRES_PASSWORD: avenor_secret
      POSTGRES_DB: avenor_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avenor -d avenor_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avenor_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres.swvhtpjexkqpjurrpzmq:rehman0900786011@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload in dev mode
      - ./src:/app/src

volumes:
  postgres_data:
